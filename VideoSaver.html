<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VideoSaver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#0F1F1C; --muted:#5B6B66;
  --accent:#0A6C5A; --on-accent:#FFFFFF; --line:#D5DDD9; --danger:#B3261E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1815; --surface:#16231F; --ink:#E9F1EE; --muted:#93A59E;
    --accent:#3FC4A6; --on-accent:#06251E; --line:#2A3C36; --danger:#F2867F;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1815; --surface:#16231F; --ink:#E9F1EE; --muted:#93A59E;
  --accent:#3FC4A6; --on-accent:#06251E; --line:#2A3C36; --danger:#F2867F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.5}
main{max-width:34rem;margin:0 auto;padding:1.5rem 1.25rem 3rem}
h1{font-size:2.4rem;font-weight:800;letter-spacing:-.03em;margin:.5rem 0 .25rem}
.lead{color:var(--muted);margin:0 0 1.5rem;max-width:30rem}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem}
label{display:block;font-weight:600;margin-bottom:.5rem}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);
  border:1.5px solid var(--line);border-radius:10px;padding:.8rem .9rem}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:.6rem;margin-top:.75rem}
button{font:inherit;font-weight:600;border-radius:10px;border:1.5px solid var(--line);
  background:transparent;color:var(--ink);padding:.8rem 1rem;cursor:pointer}
button.main{flex:1;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
#msg{min-height:1.5rem;margin:.75rem 0 0;font-size:.95rem}
#msg.err{color:var(--danger)}
.tip{margin:1rem 0 0;font-size:.9rem;color:var(--muted)}
h2{font-size:1.15rem;margin:2rem 0 .75rem}
ul{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
li{display:flex;align-items:center;gap:.5rem;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:.6rem .6rem .6rem .9rem}
li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li button{padding:.5rem .7rem;font-size:.9rem}
.empty{color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<main>
  <h1>VideoSaver</h1>
  <p class="lead">Collez le lien direct d'un fichier (vidéo, audio, document) dont vous avez le droit de téléchargement.</p>

  <div class="box">
    <label for="url">Lien du fichier</label>
    <input id="url" type="url" inputmode="url" placeholder="https://exemple.com/video.mp4" autocomplete="off">
    <div class="row">
      <button class="main" id="go">Télécharger</button>
      <button id="paste">Coller</button>
    </div>
    <p id="msg" role="status"></p>
    <p class="tip">Si la vidéo s'ouvre au lieu de se télécharger, appuyez longuement dessus puis choisissez « Télécharger la vidéo ».</p>
  </div>

  <h2>Historique</h2>
  <ul id="list"></ul>
  <p class="empty" id="empty">Aucun lien pour le moment. Collez-en un ci-dessus.</p>
</main>

<script>
const $ = id => document.getElementById(id);
const KEY = "videosaver:history";
let history = [];
try { history = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { history = []; }

function save(){ try { localStorage.setItem(KEY, JSON.stringify(history)); } catch (e) {} }
function say(t, err){ const m = $("msg"); m.textContent = t; m.className = err ? "err" : ""; }

function fileName(u){
  try { const p = new URL(u).pathname.split("/").filter(Boolean).pop(); return p ? decodeURIComponent(p) : "fichier"; }
  catch (e) { return "fichier"; }
}
function valid(u){
  try { const x = new URL(u); return x.protocol === "http:" || x.protocol === "https:"; }
  catch (e) { return false; }
}
function start(u){
  const a = document.createElement("a");
  a.href = u; a.download = fileName(u); a.target = "_blank"; a.rel = "noopener noreferrer";
  document.body.appendChild(a); a.click(); a.remove();
}
function render(){
  const ul = $("list"); ul.innerHTML = "";
  $("empty").style.display = history.length ? "none" : "block";
  history.forEach((u, i) => {
    const li = document.createElement("li");
    const s = document.createElement("span"); s.textContent = fileName(u); s.title = u;
    const d = document.createElement("button"); d.textContent = "Télécharger";
    d.onclick = () => { start(u); say("Téléchargement relancé : " + fileName(u)); };
    const x = document.createElement("button"); x.textContent = "Supprimer";
    x.onclick = () => { history.splice(i, 1); save(); render(); };
    li.append(s, d, x); ul.appendChild(li);
  });
}

$("go").onclick = () => {
  const u = $("url").value.trim();
  if (!valid(u)) { say("Lien invalide. Il doit commencer par http:// ou https://.", true); return; }
  start(u);
  history = [u, ...history.filter(h => h !== u)].slice(0, 30);
  save(); render();
  say("Téléchargement lancé : " + fileName(u));
  $("url").value = "";
};
$("paste").onclick = async () => {
  try { $("url").value = (await navigator.clipboard.readText()).trim(); }
  catch (e) { say("Collage impossible. Appuyez longuement dans le champ pour coller.", true); }
};
$("url").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
render();
</script>
</body>
</html>
